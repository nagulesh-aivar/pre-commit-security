repos:
  # detect-secrets (Yelp) - baseline-based approach
  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.4.0
    hooks:
      - id: detect-secrets
        args: ['--baseline', '.secrets.baseline']
        stages: [commit]

  # Optional: GitGuardian ggshield (if you want GitGuardian checks)
  - repo: https://github.com/gitguardian/ggshield
    rev: v1.13.1
    hooks:
      - id: ggshield
        stages: [commit]
